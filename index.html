<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة زفاف خاصة</title>
    <style>
        /* تصفير كامل للهوامش لمنع أي تداخل */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #f4f3ef;
        }

        /* شاشة البدء الترحيبية */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f0eb 0%, #e6ded7 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1s ease;
            padding: 20px;
        }

        .welcome-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(197, 168, 128, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(197, 168, 128, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            color: #8c765c;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            background-color: #8c765c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(140, 118, 92, 0.3);
        }

        .start-btn:hover {
            background-color: #735f49;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(197, 168, 128, 0.6);
        }

        /* حاوية العرض لمنع أي تداخل خارجي */
        #invitation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 9999;
            overflow: hidden; /* إخفاء التمرير الخارجي تماماً */
        }

        /* حاوية ذكية تقوم بتمديد الإطار الداخلي لمنع كانفا من تقليص الأبعاد */
        #iframe-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-y: scroll; /* السماح بالتنقل الداخلي للمحتوى الممتد */
            -webkit-overflow-scrolling: touch;
        }

        /* إجبار الإطار على تمديد الارتفاع الفعلي ليأخذ كل قسم مساحة شاشة كاملة */
        iframe {
            width: 100%;
            height: 400%; /* تمديد الطول برمجياً ليعادل 4 أقسام منفصلة */
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- شاشة البدء الترحيبية لتفعيل الصوت -->
    <div id="start-screen">
        <div class="welcome-card">
            <h1>دعوة زفاف خاصة</h1>
            <p>يسعدنا ويشرفنا حضوركم لمشاركتنا هذه الفرحة الكبرى وسماع تفاصيل اللقاء.</p>
            <button class="start-btn" id="start-button">فتح دعوة الزفاف</button>
        </div>
    </div>

    <!-- حاوية الإطار المحدثة بالتكبير البرمجي للأقسام -->
    <div id="invitation-container">
        <div id="iframe-viewport">
            <iframe id="canva-frame" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <!-- كود الصوت في الخلفية -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById("start-button").addEventListener("click", function() {
            var music = document.getElementById("bg-music");
            var startScreen = document.getElementById("start-screen");
            var container = document.getElementById("invitation-container");
            var iframe = document.getElementById("canva-frame");

            // 1. تشغيل الموسيقى
            music.play().catch(function(error) {
                console.log("Audio playback failed:", error);
            });

            // 2. تعيين رابط التضمين المستقر
            iframe.src = "https://www.canva.com/design/DAHPgbE2M90/U6ug97agChM8SEs32rQD9A/view?embed";

            // 3. تأثير الاختفاء والظهور
            startScreen.style.opacity = "0";
            container.style.display = "block";
            setTimeout(function() {
                container.style.opacity = "1";
                startScreen.style.display = "none";
            }, 1000);
        });
    </script>

</body>
</html>
