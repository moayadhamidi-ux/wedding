<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة زفاف خاصة</title>
    <style>
        /* إعدادات الخلفية العامة وتصفير الهوامش */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            background-color: #f4f3ef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* شاشة البدء الترحيبية الراقية */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f0eb 0%, #e6ded7 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .welcome-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(197, 168, 128, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(197, 168, 128, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            color: #8c765c;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            background-color: #8c765c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(140, 118, 92, 0.3);
        }

        .start-btn:hover {
            background-color: #735f49;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(197, 168, 128, 0.6);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- شاشة البدء الترحيبية لتفعيل الصوت -->
    <div id="start-screen">
        <div class="welcome-card">
            <h1>دعوة زفاف خاصة</h1>
            <p>يسعدنا ويشرفنا حضوركم لمشاركتنا هذه الفرحة الكبرى وسماع تفاصيل اللقاء.</p>
            <button class="start-btn" id="start-button">فتح دعوة الزفاف</button>
        </div>
    </div>

    <!-- كود الصوت في الخلفية -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById("start-button").addEventListener("click", function() {
            var music = document.getElementById("bg-music");

            // 1. تشغيل الموسيقى في الخلفية فوراً
            music.play().catch(function(error) {
                console.log("Audio playback failed:", error);
            });

            // 2. الانتظار للحظة بسيطة ثم الانتقال للموقع الحقيقي المنشور على كانفا مع بقاء الصوت
            setTimeout(function() {
                window.location.href = "https://xn--ngbj5e.my.canva.site/dahpgbe2m90";
            }, 300); 
        });
    </script>

</body>
</html>
